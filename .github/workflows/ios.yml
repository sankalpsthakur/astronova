name: iOS Build and Test

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'client/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'client/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  swift-ios-build:
    name: iOS Simulator tests
    runs-on: macos-15
    timeout-minutes: 45

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve iPhone simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          preferred = ('iPhone 16 Pro', 'iPhone 16', 'iPhone 15 Pro', 'iPhone 15')
          found = []
          for runtime, devs in d['devices'].items():
              for dev in devs:
                  if dev.get('isAvailable') and 'iPhone' in dev.get('name', ''):
                      found.append(dev)
          for name in preferred:
              for dev in found:
                  if dev.get('name') == name:
                      print(dev['udid'])
                      raise SystemExit(0)
          if found:
              print(found[0]['udid'])
              raise SystemExit(0)
          raise SystemExit(1)
          ")
          if [ -z "$SIM_ID" ]; then
            echo "No available iPhone simulator found; listing for debugging:" >&2
            xcrun simctl list runtimes >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          echo "Selected simulator: $SIM_ID"
          xcrun simctl list devices available

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            client/.build
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build for Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project astronova.xcodeproj \
            -scheme AstronovaApp \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            | tee build.log

      - name: Run Swift unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project astronova.xcodeproj \
            -scheme AstronovaApp \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -configuration Debug \
            -enableCodeCoverage YES \
            -only-testing:AstronovaAppTests \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            | tee test.log

      - name: Run Simulator UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project astronova.xcodeproj \
            -scheme AstronovaApp \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -configuration Debug \
            -only-testing:AstronovaAppUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath ../TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            | tee uitest.log

      - name: Check for test failures
        run: |
          if grep -q "Test Suite.*failed" test.log uitest.log 2>/dev/null; then
            echo "::error::Some tests failed"
            grep "Test Suite.*failed" test.log uitest.log || true
            exit 1
          fi

      - name: Upload build and test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-logs
          path: |
            client/build.log
            client/test.log
            client/uitest.log
            TestResults.xcresult
          if-no-files-found: ignore

  swift-lint:
    name: Swift Linting
    runs-on: macos-15

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging || true
        continue-on-error: true

  ios-summary:
    name: iOS Build Summary
    runs-on: ubuntu-latest
    needs: [swift-ios-build, swift-lint]
    if: always()

    steps:
      - name: Check build results
        run: |
          echo "iOS simulator tests completed"
          echo "Build result: ${{ needs.swift-ios-build.result }}"
          echo "Lint result: ${{ needs.swift-lint.result }}"

      - name: Fail if build failed
        if: needs.swift-ios-build.result == 'failure'
        run: exit 1
